name: Build Ghostscript

# Ghostscript for GMT.jl: small gs executable + shared libgs (PostScript
# interpreter only, no PDF/PCL/XPS readers). Every run uploads the tarballs.
# A push to master with a Ghostscript version that has no release yet publishes
# them, plus an Artifacts.toml, as release v<version>. Releases are never deleted.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        # Small gswin64c.exe + gsdll64.dll, both with the static CRT (/MT).
        run: nmake -f psi\msvc.mak WIN64= DEVSTUDIO= MAKEDLL=1 CMT=/MT BUILD_PDF=0 BUILD_PCL=0 BUILD_XPS=0 BUILD_GPDL=0 gs
      - name: Dependencies
        shell: cmd
        run: dumpbin /dependents bin\gswin64c.exe bin\gsdll64.dll
      - name: Package
        shell: bash
        run: |
          VER="$(sed -n 's/^GS_VERSION_MAJOR=//p' base/version.mak).$(sed -n 's/^GS_VERSION_MINOR=//p' base/version.mak).$(sed -n 's/^GS_VERSION_PATCH=//p' base/version.mak)"
          VER="$(echo "$VER" | tr -d '\r')"
          mkdir -p _stage/bin _stage/share/licenses/ghostscript dist
          cp bin/gswin64c.exe bin/gsdll64.dll _stage/bin/
          cp LICENSE _stage/share/licenses/ghostscript/
          tar -C _stage -czf "dist/gs-$VER-windows-x86_64.tar.gz" .
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Test the package (exe + libgs)
        shell: bash
        run: |
          mkdir -p t && tar -C t -xzf dist/*.tar.gz
          bash ci/smoke-test.sh t/bin/gswin64c.exe
          julia ci/libgs-test.jl t/bin/gsdll64.dll ci/smoke.ps
      - uses: actions/upload-artifact@v4
        with:
          name: gs-windows-x86_64
          path: dist/*.tar.gz

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64
            plat: linux-x86_64
          - runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            plat: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # manylinux2014 = CentOS 7, glibc 2.17: the binary runs on old distros.
      # Run the container by hand: actions inside it would need a newer glibc.
      - name: Build in manylinux2014
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} bash -c \
            "yum -y -q install autoconf automake libtool && bash ci/build-unix.sh ${{ matrix.plat }} /src/dist"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Test the package on the host (newer distro)
        run: |
          mkdir -p t && tar -C t -xzf dist/*.tar.gz
          bash ci/smoke-test.sh t/bin/gs
          julia ci/libgs-test.jl t/bin/libgs.so ci/smoke.ps
      - uses: actions/upload-artifact@v4
        with:
          name: gs-${{ matrix.plat }}
          path: dist/*.tar.gz

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            plat: macos-x86_64
          - runner: macos-14
            plat: macos-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool
      - name: Build
        run: bash ci/build-unix.sh ${{ matrix.plat }} "$PWD/dist"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Test the package
        run: |
          mkdir -p t && tar -C t -xzf dist/*.tar.gz
          bash ci/smoke-test.sh t/bin/gs
          julia ci/libgs-test.jl t/bin/libgs.dylib ci/smoke.ps
      - uses: actions/upload-artifact@v4
        with:
          name: gs-${{ matrix.plat }}
          path: dist/*.tar.gz

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        # One release per Ghostscript version, never deleted: a published GMT.jl
        # points at it. A version that already has one (v10.09.0 or v10.09.0-N)
        # is only built and tested.
        run: |
          VER="$(sed -n 's/^GS_VERSION_MAJOR=//p' base/version.mak).$(sed -n 's/^GS_VERSION_MINOR=//p' base/version.mak).$(sed -n 's/^GS_VERSION_PATCH=//p' base/version.mak)"
          TAG="v$(echo "$VER" | tr -d '\r')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release list -R "$REPO" --limit 1000 --json tagName -q '.[].tagName' | grep -qE "^${TAG//./\.}(-[0-9]+)?$"; then
            echo "A release of $TAG already exists: not publishing."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: julia-actions/setup-julia@v2
        if: steps.ver.outputs.new == 'true'
        with:
          version: '1'
      - name: Artifacts.toml
        if: steps.ver.outputs.new == 'true'
        run: |
          julia ci/artifacts-toml.jl dist \
            "https://github.com/$REPO/releases/download/${{ steps.ver.outputs.tag }}" \
            > dist/Artifacts.toml
          cat dist/Artifacts.toml
      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        run: gh release create "${{ steps.ver.outputs.tag }}" dist/* -R "$REPO" --target "${{ github.sha }}" --latest --title "${{ steps.ver.outputs.tag }}" --notes "Ghostscript for GMT.jl: gs + shared libgs, PostScript interpreter only (no PDF/PCL/XPS readers). Artifacts.toml entries for GMT.jl attached."
